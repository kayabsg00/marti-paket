<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12161c">
<meta name="description" content="Kısa günlük, odak zamanlayıcısı ve günlük ipuçları.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Odak">
<title>Odak</title>
<script>
(function () {
  try {
    var raw = JSON.parse(localStorage.getItem('odak-v1') || '{}');
    var t = raw && raw.settings && raw.settings.theme;
    var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', dark ? '#12161c' : '#f4f0e8');
  } catch (e) {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
})();
</script>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="stylesheet" href="./app.css">
</head>
<body>
<header>
  <div class="bar">
    <button type="button" class="brand" data-act="go" data-screen="home">Odak</button>
    <button type="button" class="iconbtn" id="setBtn" data-act="go" data-screen="settings" aria-label="Ayarlar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.2M12 18.8V21M3 12h2.2M18.8 12H21M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6"/></svg>
    </button>
  </div>
</header>
<main id="app"></main>
<nav id="nav" aria-label="Ana menü">
  <button type="button" data-act="go" data-screen="home" class="on" aria-current="page">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20H4z"/><path d="M10 20v-6h4v6"/></svg>
    <span>Bugün</span>
  </button>
  <button type="button" data-act="go" data-screen="journal">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4.5h11a1 1 0 0 1 1 1V20H8a2 2 0 0 0-2 2V4.5z"/><path d="M6 18.5h12"/></svg>
    <span>Günlük</span>
  </button>
  <button type="button" data-act="go" data-screen="focus">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="7"/><path d="M12 10v3.5L14.2 15M9 4h6"/></svg>
    <span>Odak</span>
  </button>
  <button type="button" data-act="go" data-screen="tips">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4"/><path d="M8.2 14a5 5 0 1 1 7.6 0c-.7.7-1.3 1.4-1.5 2.2H9.7c-.2-.8-.8-1.5-1.5-2.2z"/></svg>
    <span>İpucu</span>
  </button>
</nav>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="./tips.js"></script>
<script src="./app.js"></script>
</body>
</html>
