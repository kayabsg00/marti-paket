<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1116"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.json"><link rel="icon" href="./icon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<title>TAG Kazanç</title>
<style>
:root{--bg:#0e1116;--card:#171b22;--line:#262c36;--tx:#e6e9ef;--mut:#8b93a1;--g:#22c55e;--r:#ef4444;--a:#f59e0b;--b:#3b82f6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:80px}
header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
.wallet{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 12px;cursor:pointer}
.wallet small{color:var(--mut);display:block;font-size:12px}.wallet b{font-size:20px}
main{padding:14px;max-width:560px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
button{font:inherit;border:0;border-radius:14px;padding:14px;color:#fff;background:var(--line);cursor:pointer;font-weight:600}
.big{width:100%;font-size:22px;padding:22px}.g{background:var(--g);color:#04210f}.r{background:var(--r)}.b{background:var(--b)}.a{background:var(--a);color:#231400}
input,textarea{font:inherit;width:100%;background:#0b0e13;color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:18px}
.num{font-size:34px;text-align:center;font-weight:700}
.row{display:flex;gap:10px}.row>*{flex:1}
.timer{font-size:44px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
.mut{color:var(--mut);font-size:14px}.c{text-align:center}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stats div{background:#0b0e13;border-radius:12px;padding:10px}.stats b{display:block;font-size:20px}
.tabs{display:flex;background:var(--card);border-radius:14px;padding:4px;margin-bottom:10px}.tabs button{flex:1;background:none;padding:10px}.tabs button.on{background:var(--line)}
.e{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.e:last-child{border:0}
.e .amt{font-weight:700;min-width:90px;text-align:right}.e .sm{padding:8px 10px;font-size:14px}
.pos{color:var(--g)}.neg{color:var(--r)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border-radius:0;padding:16px 4px;color:var(--mut)}nav button.on{color:var(--g)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-size:12px;color:var(--mut);text-align:center}
.d{min-height:62px;background:#0b0e13;border-radius:10px;padding:4px;font-size:11px;cursor:pointer;border:1px solid transparent}
.d.has{border-color:var(--line);background:#121820}.d.today{border-color:var(--b)}.d .n{font-weight:700;font-size:13px}
.d .v{font-weight:700;font-size:11px}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;z-index:10}.modal.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;margin:auto auto 0;border-radius:20px 20px 0 0;padding:18px;max-height:88vh;overflow:auto}
h2{margin:4px 0 12px;font-size:20px}h3{margin:6px 0;font-size:16px}
.hide{display:none}
</style></head><body>
<header><div class="wallet" id="wallet" onclick="walletOpen()"><small>👛 Cüzdan</small><b id="wv">₺0</b></div><div class="mut" id="hdate"></div></header>
<main>
<section id="pgDay"></section>
<section id="pgCal" class="hide"></section>
<section id="pgSet" class="hide"></section>
</main>
<nav><button id="nDay" class="on" onclick="go('Day')">🚗 Gün</button><button id="nCal" onclick="go('Cal')">📅 Takvim</button><button id="nSet" onclick="go('Set')">⚙️ Ayarlar</button></nav>
<div class="modal" id="modal" onclick="if(event.target===this)closeM()"><div class="sheet" id="sheet"></div></div>
<script>
const K='tagApp_v1';
let S=load(), tab='in', calM=new Date(); calM.setDate(1);
function load(){try{return Object.assign({days:[],open:null,adj:[]},JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){return{days:[],open:null,adj:[]}}}
function save(){localStorage.setItem(K,JSON.stringify(S))}
const nf=new Intl.NumberFormat('tr-TR',{minimumFractionDigits:0,maximumFractionDigits:2});
const tl=v=>(v<0?'-':'')+'₺'+nf.format(Math.abs(Math.round(v*100)/100));
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tm=t=>new Date(t).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
const dt=t=>new Date(t).toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric',weekday:'long'});
const pn=v=>{v=String(v).replace(/\s/g,'');if(v.includes(','))v=v.replace(/\./g,'').replace(',','.');return parseFloat(v)};
const dur=ms=>{const m=Math.floor(ms/60000);return Math.floor(m/60)+' sa '+String(m%60).padStart(2,'0')+' dk'};
const dkey=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function calc(d){const end=d.end||Date.now();const inc=d.entries.filter(e=>e.t==='in').reduce((a,e)=>a+e.v,0);
 const exE=d.entries.filter(e=>e.t==='ex').reduce((a,e)=>a+e.v,0);const fuel=d.fuel||0;const ex=exE+fuel;const net=inc-ex;const ms=end-d.start;const h=ms/3600000;
 return{inc,ex,fuel,net,ms,h,ph:h>0?net/h:0,pk:d.km>0?net/d.km:0,rides:d.entries.filter(e=>e.t==='in').length}}
function walletTotal(){let w=S.days.reduce((a,d)=>a+calc(d).net,0);if(S.open)w+=calc(S.open).net;return w+S.adj.reduce((a,x)=>a+x.v,0)}
function go(p){['Day','Cal','Set'].forEach(x=>{document.getElementById('pg'+x).classList.toggle('hide',x!==p);document.getElementById('n'+x).classList.toggle('on',x===p)});render()}
function render(){const w=walletTotal();const wv=document.getElementById('wv');wv.textContent=tl(w);wv.className=w<0?'neg':'';
 document.getElementById('hdate').textContent=new Date().toLocaleDateString('tr-TR',{day:'numeric',month:'short',weekday:'short'});
 rDay();rCal();rSet()}
function rDay(){const el=document.getElementById('pgDay');
 if(!S.open){const last=S.days[S.days.length-1];
  el.innerHTML=`<div class="card c"><p class="mut">Şu an açık gün yok</p><button class="big g" id="btnOpen" onclick="openDay()">▶ Günü Aç</button></div>`+(last?summary(last,'Son gün'):'');return}
 const d=S.open,c=calc(d);
 el.innerHTML=`<div class="card"><div class="mut c">Açılış: ${tm(d.start)} · ${new Date(d.start).toLocaleDateString('tr-TR')}</div><div class="timer" id="timer">${clock(c.ms)}</div>
 <div class="stats"><div><span class="mut">Gelir</span><b class="pos">${tl(c.inc)}</b></div><div><span class="mut">Gider</span><b class="neg">${tl(c.ex)}</b></div>
 <div><span class="mut">Net</span><b>${tl(c.net)}</b></div><div><span class="mut">Müşteri</span><b>${c.rides}</b></div></div></div>
 <div class="card"><div class="tabs"><button class="${tab==='in'?'on':''}" onclick="tab='in';rDay()">+ Gelir</button><button class="${tab==='ex'?'on':''}" onclick="tab='ex';rDay()">− Gider</button></div>
 <input id="amt" class="num" inputmode="decimal" placeholder="₺ tutar" onkeydown="if(event.key==='Enter')addE()">
 <input id="note" placeholder="${tab==='in'?'Not (isteğe bağlı)':'Ne gideri? (yemek, yıkama…)'}" style="margin:8px 0;font-size:16px" onkeydown="if(event.key==='Enter')addE()">
 <button class="big ${tab==='in'?'g':'r'}" id="btnAdd" onclick="addE()">${tab==='in'?'Gelir Ekle':'Gider Ekle'}</button></div>
 <div class="card"><h3>Bugünün kayıtları (${d.entries.length})</h3>${d.entries.length?d.entries.slice().reverse().map(e=>entryRow(e)).join(''):'<p class="mut">Henüz kayıt yok</p>'}</div>
 <div class="card"><h3>Günü Kapat</h3><div class="row"><div><span class="mut">Kaç km?</span><input id="km" inputmode="decimal" placeholder="km"></div><div><span class="mut">Yakıt ₺</span><input id="fuel" inputmode="decimal" placeholder="₺"></div></div>
 <button class="big a" style="margin-top:10px" id="btnClose" onclick="closeDay()">■ Günü Kapat</button></div>`}
function entryRow(e){return `<div class="e"><span class="mut">${tm(e.ts)}</span><span style="flex:1">${esc(e.note)}</span><span class="amt ${e.t==='in'?'pos':'neg'}">${e.t==='in'?'+':'−'}${tl(e.v)}</span><button class="sm" onclick="editE('${e.id}')">✎</button><button class="sm" onclick="delE('${e.id}')">🗑</button></div>`}
const clock=ms=>{const s=Math.floor(ms/1000);return String(Math.floor(s/3600)).padStart(2,'0')+':'+String(Math.floor(s/60)%60).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
function openDay(){if(S.open)return alert('Zaten açık bir gün var.');S.open={id:'d'+Date.now(),start:Date.now(),entries:[]};save();render()}
function addE(){const a=document.getElementById('amt');const v=pn(a.value);if(!(v>0)){a.focus();return}
 S.open.entries.push({id:'e'+Date.now()+Math.random().toString(36).slice(2,5),t:tab,v,note:document.getElementById('note').value.trim(),ts:Date.now()});save();render();document.getElementById('amt').focus()}
function delE(id){if(!confirm('Kayıt silinsin mi?'))return;S.open.entries=S.open.entries.filter(e=>e.id!==id);save();render()}
function editE(id){const e=S.open.entries.find(x=>x.id===id);const v=prompt('Yeni tutar (₺):',String(e.v).replace('.',','));if(v===null)return;const n=pn(v);if(!(n>0))return alert('Geçersiz tutar');
 const no=prompt('Not:',e.note||'');e.v=n;if(no!==null)e.note=no.trim();save();render()}
function closeDay(){const km=pn(document.getElementById('km').value||0)||0,fuel=pn(document.getElementById('fuel').value||0)||0;
 if(!confirm('Gün kapatılsın mı?'))return;const d=S.open;d.end=Date.now();d.km=km;d.fuel=fuel;S.days.push(d);S.open=null;save();render();showDay(d.id)}
function summary(d,title){const c=calc(d);return `<div class="card"><h3>${title||'Gün özeti'}</h3><div class="mut">${dt(d.start)}<br>${tm(d.start)} → ${tm(d.end)} (${dur(c.ms)})</div><br>
 <div class="stats"><div><span class="mut">Gelir</span><b class="pos">${tl(c.inc)}</b></div><div><span class="mut">Gider (yakıt dahil)</span><b class="neg">${tl(c.ex)}</b></div>
 <div><span class="mut">Net</span><b class="${c.net<0?'neg':'pos'}">${tl(c.net)}</b></div><div><span class="mut">Süre</span><b>${dur(c.ms)}</b></div>
 <div><span class="mut">Saatlik net</span><b>${tl(c.ph)}</b></div><div><span class="mut">Km başı net</span><b>${d.km?tl(c.pk):'—'}</b></div>
 <div><span class="mut">Müşteri sayısı</span><b>${c.rides}</b></div><div><span class="mut">Müşteri başı ort.</span><b>${c.rides?tl(c.inc/c.rides):'—'}</b></div><div><span class="mut">Saatte müşteri</span><b>${c.h>0?nf.format(Math.round(c.rides/c.h*10)/10):'—'}</b></div><div><span class="mut">Km / Yakıt</span><b>${nf.format(d.km||0)} km · ${tl(c.fuel)}</b></div></div></div>`}
function showDay(id){const d=S.days.find(x=>x.id===id);if(!d)return;
 M(summary(d,'Gün özeti')+`<div class="card"><h3>Kayıtlar</h3>${d.entries.map(e=>`<div class="e"><span class="mut">${tm(e.ts)}</span><span style="flex:1">${esc(e.note)}</span><span class="amt ${e.t==='in'?'pos':'neg'}">${e.t==='in'?'+':'−'}${tl(e.v)}</span></div>`).join('')||'<p class="mut">Kayıt yok</p>'}</div>
 <div class="row"><button class="r" onclick="delDay('${d.id}')">Günü Sil</button><button onclick="closeM()">Kapat</button></div>`)}
function delDay(id){if(!confirm('Bu gün tamamen silinsin mi?'))return;S.days=S.days.filter(x=>x.id!==id);save();closeM();render()}
function rCal(){const el=document.getElementById('pgCal');const y=calM.getFullYear(),m=calM.getMonth();
 const days=S.days.filter(d=>{const s=new Date(d.start);return s.getFullYear()===y&&s.getMonth()===m});
 let net=0,h=0;days.forEach(d=>{const c=calc(d);net+=c.net;h+=c.h});
 const by={};days.forEach(d=>(by[dkey(d.start)]=by[dkey(d.start)]||[]).push(d));
 const first=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate(),tk=dkey(Date.now());
 let g=['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'].map(x=>`<div class="h">${x}</div>`).join('')+'<div></div>'.repeat(first);
 for(let i=1;i<=n;i++){const k=dkey(new Date(y,m,i));const L=by[k]||[];let inner='';
  if(L.length){let dn=0,dh=0;L.forEach(d=>{const c=calc(d);dn+=c.net;dh+=c.h});inner=`<div class="v ${dn<0?'neg':'pos'}">${tl(dn)}</div><div class="mut" style="font-size:10px">${nf.format(Math.round(dh*10)/10)}sa · ${tl(dh?dn/dh:0)}/sa</div>`}
  g+=`<div class="d ${L.length?'has':''} ${k===tk?'today':''}" onclick="${L.length?`dayList('${k}')`:''}"><div class="n">${i}</div>${inner}</div>`}
 el.innerHTML=`<div class="card"><div class="row" style="align-items:center"><button onclick="calM.setMonth(calM.getMonth()-1);rCal()" style="flex:0">◀</button>
 <h2 class="c" style="flex:1;margin:0">${calM.toLocaleDateString('tr-TR',{month:'long',year:'numeric'})}</h2><button onclick="calM.setMonth(calM.getMonth()+1);rCal()" style="flex:0">▶</button></div><br>
 <div class="stats" style="grid-template-columns:1fr 1fr 1fr"><div><span class="mut">Ay net</span><b class="${net<0?'neg':'pos'}">${tl(net)}</b></div><div><span class="mut">Saat</span><b>${nf.format(Math.round(h*10)/10)}</b></div><div><span class="mut">Ort. saatlik</span><b>${tl(h?net/h:0)}</b></div></div>
 <div class="mut c" style="margin-top:6px">${days.length} gün çalışıldı · ${days.reduce((a,d)=>a+calc(d).rides,0)} müşteri</div></div><div class="card cal">${g}</div>`}
function dayList(k){const L=S.days.filter(d=>dkey(d.start)===k);if(L.length===1)return showDay(L[0].id);
 M(`<h2>${dt(L[0].start)}</h2>`+L.map(d=>{const c=calc(d);return `<button style="width:100%;margin-bottom:8px;text-align:left" onclick="showDay('${d.id}')">${tm(d.start)}–${tm(d.end)} · Net ${tl(c.net)} · ${dur(c.ms)}</button>`}).join(''))}
function walletOpen(){const w=walletTotal();
 M(`<h2>👛 Cüzdan: ${tl(w)}</h2><p class="mut">Tüm günlerin net toplamı + manuel düzeltmeler. Para çektiysen veya kasayı gerçek nakde eşitlemek istersen buradan gir.</p>
 <input id="wa" class="num" inputmode="decimal" placeholder="₺ tutar"><input id="wn" placeholder="Not (örn. para çektim)" style="margin:8px 0">
 <div class="row"><button class="r" id="btnWOut" onclick="adj(-1)">− Para Çektim</button><button class="g" onclick="adj(1)">+ Ekle</button></div>
 <button style="width:100%;margin-top:8px" onclick="setTo()">Cüzdanı bu tutara eşitle</button>
 <h3 style="margin-top:16px">Düzeltmeler</h3>${S.adj.slice().reverse().map(a=>`<div class="e"><span class="mut">${new Date(a.ts).toLocaleDateString('tr-TR')} ${tm(a.ts)}</span><span style="flex:1">${esc(a.note)}</span><span class="amt ${a.v<0?'neg':'pos'}">${tl(a.v)}</span><button class="sm" onclick="delAdj('${a.id}')">🗑</button></div>`).join('')||'<p class="mut">Yok</p>'}`)}
function adj(s,force){const v=force!==undefined?force:pn(document.getElementById('wa').value)*s;if(!v&&v!==0||isNaN(v))return;
 S.adj.push({id:'a'+Date.now(),v,note:(document.getElementById('wn').value.trim()||(force!==undefined?'Eşitleme':s<0?'Para çektim':'Ekleme')),ts:Date.now()});save();render();walletOpen()}
function setTo(){const t=pn(document.getElementById('wa').value);if(isNaN(t))return;adj(0,t-walletTotal())}
function delAdj(id){S.adj=S.adj.filter(a=>a.id!==id);save();render();walletOpen()}
function rSet(){const el=document.getElementById('pgSet');el.innerHTML=`<div class="card"><h3>Yedekleme</h3><p class="mut">Veriler sadece bu cihazda (tarayıcıda) saklanır. Düzenli yedek almanı öneririm.</p>
 <button class="b big" onclick="exp()">⬇ Yedeği İndir (JSON)</button><br><br><label><button class="big" onclick="document.getElementById('imp').click()">⬆ Yedekten Yükle</button></label><input type="file" id="imp" accept=".json,application/json" class="hide" onchange="imp(this)"></div>
 <div class="card"><h3>Cüzdan</h3><button class="big" onclick="walletOpen()">Para çektim / düzelt</button></div>
 <div class="card"><h3>Özet</h3><p class="mut">${S.days.length} kapalı gün · Toplam net ${tl(S.days.reduce((a,d)=>a+calc(d).net,0))}</p><button class="r" onclick="wipe()">Tüm verileri sil</button></div>`}
function exp(){const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='tag-yedek-'+dkey(Date.now())+'.json';a.click()}
function imp(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.days))throw 0;if(!confirm('Mevcut veriler yedekle değiştirilsin mi?'))return;S=Object.assign({days:[],open:null,adj:[]},d);save();render();alert('Yedek yüklendi')}catch(e){alert('Geçersiz yedek dosyası')}};r.readAsText(f)}
function wipe(){if(confirm('TÜM veriler silinecek. Emin misin?')&&confirm('Geri alınamaz. Son kez onayla.')){S={days:[],open:null,adj:[]};save();render()}}
function M(h){document.getElementById('sheet').innerHTML=h;document.getElementById('modal').classList.add('on')}
function closeM(){document.getElementById('modal').classList.remove('on')}
setInterval(()=>{if(S.open){const c=calc(S.open);const t=document.getElementById('timer');if(t)t.textContent=clock(c.ms)}},1000);
window.addEventListener('storage',()=>{S=load();render()});
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{});
</script></body></html>
